body:
  text: 首殘復諸說不同莫過三分今即依此三分開文不一明序分即興致之由二辨正宗即合成之益三顯流通即澤沾遐代依佛地論說此三名復不同一教起因緣分二聖教所說分三依教奉行分教起因緣者即是教起之因所緣即是如是等六第二所說分者顯所說法門品類差別依教奉行者謂時人聞佛聖教奉而行之此雖名字不同與前一者通序即諸經皆有故名為通二者別序此之二種即古舊相傳名證信序發起序耳通起通序有二一制立因緣二別解釋制立因緣者緣起如何解云依智度論阿難請佛如來教置此之經教如彼說二別解者一列其名二依名釋列名者於中六句一信成二聞成三時門四主成五處成六眾成今言如是者此信成也此有二種一是能信即阿難心二者所信即此經法信以決定為義此有二種一體二相體即是心相即是口由心信故即口稱如是但信為道元智為道本進念定三網羅終始五根既具堪受堪傳信既在初故云如是如則指法是為定辭如佛所說一切皆是故曰如是華嚴大論並同此說依佛地論義有四門論云如是我聞者謂顯己聞傳佛教者言如是事我昔曾聞依四義轉轉猶起也一依譬喻二依教誨三依問答四依許可依譬喻者如有說言如是富貴如毗沙門依教誨者如有說言汝當如是讀誦經論依問答者如是我聞如是宣說依許可者如有說言我當為汝如是而思如是而作如是而說或信可言是事如是依真疏釋如是者此有六門一依譬喻二依教化三依修行四依決定五依不異六依如實初譬喻如是者如言此人大富如毗沙門天王又復如言此人大智猶如大海大海譬般若慈悲慈悲故不捨有般若故不住滅第二教化如是者此有五種一父母二師僧三國主四閻羅王五世尊如好兒父母教敕即能隨從若惡子者父母慈悲令師教誨若師教不從國法治之又為惡不改命終之後閻羅王治發大心者如來教之前四教者不名教化以不定故最後一方是教化有深益故如言應作如是莫作依師教行不減不長名教化如是此之二門同佛地論第三修行如是者此有四種一者智慧二者功德三者真實四者正信智慧者有二一是無我二無我所前則人空後則法空達人空故不見能修得法空故不見所修故下經云如是滅度無量眾生實無眾生得滅度者是名智慧修行功德者是五波羅蜜多三輪清淨故故下經云應如是布施不住於相想是名功德修行真實者修行有三一者外凡夫二者二乘三者菩薩外道修行是世間法虛妄顛倒謬執有我不名真實二乘之人雖是佛法心迷著相無有慈悲雖得人空不達法空執無我相非實境故亦不真實菩薩修者方名真實善得二空無偏執故故下經云如是諸相非相則見如來是名真實修行正信者凡信有三一邪信二正信不依理三正依理信初即外道僻執修行空無所得不名為信次即二乘修得少分亦不究竟故非正信後即菩薩修無上菩提不同前二所得功德諸佛證知方名正信故下經言聞是修多羅乃至一念能生淨信如來悉知等是名正信修行第四決定如是者此有三種一聞二理三人決定聞者阿難親從佛聞不增不減非是傳聞如所聞說名決定聞決定理者即二空理亦名法界亦稱真如離此之外更無別理通達此理決是聖人是決定理決定人者即是世尊尊者阿難親從佛聞還自說非從餘聞是名決定人第五不異如是者此有三種謂名句味名不異故能生聞慧句不異故能生思慧味不異故能生修慧又名不異故初善句不異故中善味不異故後善又初善者即道前如如中善者即十地行後善者即佛果德今以難說法利益如佛故名不異第六如實如是者一為斷疑二令生信斷疑者阿難比丘佛滅度後結集法時身登高座有三十二相八十種好是佛世尊住持之力加被阿難身相如佛當時徒眾遂有三疑一疑世尊已入涅槃恐是大悲還從滅起二疑尊者是佛堂弟將非紹繼身成佛耶三疑他佛來此土耶為拂此疑故說六句云如是法我從佛聞令生信者智度論云說時方人欲令眾生生信心故經曰我聞者此第二聞成也依大智度論問曰若佛法中言一切法空一切無有吾我云何佛經初云如是我聞答佛弟子雖知無我隨俗法說我非實我也世界法中說非第一義復次世界說言有三根本一邪二慢三名字是中二不淨一淨一切凡夫三種語見道學人二種語除見聖人一種語除見慢聞者阿毗曇用耳根聞成實論說用耳識聞依大乘宗和合故聞智度論說問曰聞者為用耳根聞為用耳識聞為意識聞若耳根聞無識空根何故不聞若耳識聞識一念不能分別亦不應聞若意識聞聾人亦應聞以意識不壞故答曰聞是因緣聞耳根不壞聲至可聞處作意欲聞情塵意和合因緣聞故曰聞又復我者依佛地論說我謂諸蘊世欲假者聞謂耳根發識聽受廢別就總故說我聞有義如來慈悲本願增上緣力聞者識上文義相生此文義相雖親依自善根力起而就強緣名為佛說由耳根力自心變現故名我聞有義聞者善根本願增上緣力如來識上文義相生此文義相是佛利他善根所起名為佛說聞者識心雖不取得然似彼相分明顯現故名我聞也夫聞有三一倒二亂三正倒復有三一能說者倒二所說法倒三能聽者倒能說者倒者如頞婆婆藪仙人云煞生祠天得生天上得壽命長此是倒見故能說者倒所說倒者無次第違法相執一切世間有常樂我淨著斷常見等如婆藪仙人於波斯國初說善法竟欲還本國波斯國人惜不許去遂打腳折仙人云我更說最上好法遂倒說十惡云是善法國人受行於今不改此為倒說能聽者倒者有二一凡夫二二乘凡夫聞佛說偈煞父及害母王二婆羅門國界並人民是名清淨行此偈是喻謂煞癡愛心王國耳五陰界數法人民如此名行而凡夫不解謂父母此名倒聞二乘倒聞者如佛說一切法本性清淨不生不滅常住無變二乘聞已心生恐怖不受此法作三種觀相而求三脫此為倒聞以不依真如道理故第二散亂聞者有二一不敬師二不信法不敬師故心驕慢不信法故不攝耳聽雖聽心緣別境猶如覆器瀉水不入故名散亂聞第三正聞者如尊阿難敬信佛法一心正受如瓶瀉水置之一器不倒不亂心緣正法常無厭足如貧念寶如病思藥不增不減義味真正無諸疑滯是名正聞謂阿難比丘親承音旨隨世流布故曰我聞經曰一時者第三時成也謂俱合時俱合時者有三一法王在坐二正說此經三親承音旨三義不闕名俱合時佛地論說一時者謂說聽時此就剎那相續無斷說聽究竟總名一時若不爾者字名句等說聽時異云何言一又長耳三藏解時有三種一分段世分時二不思議變易時三假名時分段時者五陰為體心相為相一斯果報如陶家輪勢極則住名分段時變易時生死相轉於法分齊難識名不思議變易時假名時者外國名劫婆目有三意一迦羅二三摩耶三世流布迦羅者此云別相時如制戒律大戒時聞小戒時不聞出家時聞在家時不聞等三摩耶者此云破邪見時謂諸經論不簡緇素一切得聞此二與大論同世流布者七種語中世流布語世語一時如云我於一時在申恕林等調音起轉即是世人語法今依後二故名一時佛地論云有為法上假立分位或是心上分位影像依色心等總假立故是不相應行蘊所攝經曰婆伽婆者此第四主成也此外國語唐云世出世尊今存本語也依佛地論說謂薄伽聲依六義轉一自在義二熾盛義三端嚴義四名稱義五吉祥義六尊貴義此義云何謂諸如來不繫屬諸煩惱故具自在義炎猛智火所燒練故具熾盛義妙三十二大士相等所莊嚴故具端嚴義一切殊勝功德圓滿無不知故具名稱義一切世間親近供養咸稱贊故具吉祥義具一切德常起方便利益安樂一切有情無懈廢故具尊貴義問佛有十號何故一切經首但置此名答依佛地經論釋云謂此一名世咸尊重故諸外道法稱本師名薄伽梵又此一名總攝眾德餘名不爾是故經首皆置此名依涅槃經七義解釋廣如彼論彼大智論四義解釋論云云何名婆伽婆此翻有德婆伽名德婆言有是名有德復次婆伽名分別婆名巧巧分別諸法總相別相是故名婆伽婆復次婆伽名聲婆名有是名有名聲復次婆伽名破婆名能能破婬怒癡故稱婆伽婆佛地經論以六義釋廣如彼說經曰在舍婆提城祇樹給孤獨園者此處成也舊經中或言舍衛國或云憍薩羅今新譯經云在室羅筏住誓多林給孤獨園皆同也此云聞城者十二遊經云無物不有國法鏡經言聞物國善見律云多有國智士英髦皆歸此國故言多有在中印度境祇樹給孤獨園者前明在國為化俗人此住給園統出家眾正言誓多此云最勝太子之名舊曰祇陀者訛也樹者謬即太子所施本音煩那或云煩泥此翻為林舊云樹者謬也給孤獨者謂須達長者好施孤窮從行為目國人遂號給孤獨氏太子施樹長者買園合為名也如餘經說問印度之境有多大國如來何故偏在此城耶答智度論說為報二恩多住二處一者為報法身恩故多住王舍城二者為報生身恩故多住舍婆提問佛偏二處何名平等答有二義一遂本願二益眾生須達既廣行施多有人物又此大城有十二億家為益處廣所以多住經曰與大比丘眾千二百五十人俱者此第六眾成也即是同聞以身兼彼名曰與猶共也大論說云共謂同一施一戒一見及三業慈大者或大或多或勝能破大惡能證大果為天人王大人恭敬是故名大數至千二百五十故名多論議能破九十五種道故名勝佛地論云一切皆是最極利根波羅蜜多種姓聲聞故名為大皆住無學果位故名為大又云如實義者皆是不定種姓聲聞得小果已趣大菩提故名為大比丘者義譯三種一曰怖魔二稱乞士三名破惡依此即為初中後也夫創入玄門即建降魔之志故剃髮染衣天宮動而魔怖身為道器身安道隆故已治法服須乞食以資身聖人道長凡夫道消故所修已滿即破惡以證果然乞士有三一不高慢二不懈怠三不獨用不高慢者剃髮披服執鉢不言我是上姓不可從貧下乞假令百里數十里但有食處必須從乞菩薩亦爾發菩提心披忍辱衣手執法器隨行聽法不言我是貴姓彼是賤人而不從其受學設使百里數十里有說法處即應往聽不懈怠者知世危脆有為非安急急行道如救頭然菩薩亦爾知三種眾生根性各異稱機說法皮肉心難可共住魔化眾生不暫時停名不懈怠不獨用者比丘乞食還已先減取上分供養聖僧又以一分別擬施外來乞者又食竟所餘施鳥獸菩薩亦爾通達法如如已先以妙辭深義贊歎諸佛次化同類令得此如如法相後向眾生說我已通達如如汝今亦應修集得見佛性外國名僧伽此言和合眾生云何和合一同為一法二信受無違故名和合千二百五十人者是佛常隨之眾但標數而不列名者既是常隨非他處來故依智度論優樓頻螺迦葉兄弟三人共有千人眷屬身子目連共有二百五十人並舊是外道梵志佛度出家皆得聖果雖曰無學猶荷佛重恩是故常隨供養進止同游名俱此中但列聲聞菩薩略而不舉若準下流通分中此間應說但翻譯略之故下文言佛說此經已長老須菩提及諸比丘比丘尼優婆塞優婆夷菩薩摩訶薩一切世間天人阿修羅乾達婆等即有九眾今此初首但舉聲聞何故如是依佛地論略為八義一者為於大乘生疑惑者除彼疑故二者為引不定種姓菩薩生定信故三者為已清淨諸大聲聞捨於自身尊貴慢故四者為諸聲聞常隨佛故五者為諸聲聞形同佛故六者為諸聲聞內眷屬故七者令諸菩薩於聲聞眾生恭敬故八者亦令其餘於聲聞眾生淨信故何故名聲聞依法華經迦葉自說我等今者真是聲聞以佛道聲令一切聞佛地論釋聞佛言音而悟聖道故名聲聞經約利他論依自利耳通序證信竟經曰爾時世尊者次明別序即發起序但屬此經於中兩重一佛自發起即冥加召眾二弟子發起即蒙加來集前中復兩一外化二內靜外化八重一化主二化辰三化儀四化處五化事六化等七化滿八化終此化主也成實論云具上九號故曰世尊同前婆伽婆釋又有四義一非世間無三品煩惱故二具足諸功德力不共法等三無染有二義一無染二離垢無染者道前法身離垢者通道後法身四利益無分別此即功德智慧五度功德故利益般若智慧故無分別又悲故不入無為智故不著生死悲故異二乘智故別外道故曰世尊經曰食時者此第二化辰也時有二種一歌羅此云長時二三摩耶此云短時前是外道所執是長時三摩耶有二義一名短時二契劑時短者念念不住故今言時者正是三摩耶時得食者得啖過即不得受用異外道所執外道云歌羅名為無契劑故云長時僧佉日出乞食鞞世師日盡乞是時時無定時佛異此四外道但隨世法同人間時謂出家人依齋法中食之時別本云於日前分即辰巳之間經曰著衣持鉢者第三化儀也著衣者著僧伽梨衣然佛制三衣亦表中道但俗人華飾數重外道裸形無恥今明離此二邊唯畜三衣衣須壞色此彰少欲知足行成持鉢者謂持四王所奉石鉢此義云何佛在道樹未成正覺受乳糜時所用金鉢食竟棄於水中初成道時欲受提婆利叉鄰鼓龍等所施諸果而未有鉢自念三世諸佛無手受食法而阿迦尼吒天見佛心念即送過去諸佛四枚石鉢置四天王宮而四天王即以奉佛佛無漏心併受四鉢按之成一緣有四父自爾恆用佛涅槃後此鉢終應歸彼天上還成四鉢彌勒下生還用此鉢事相亦爾此鉢真諦說在罽賓奘法師云在波斯國此衣與鉢常自隨身如鳥二翼與諸弟子作誠儀式耳復有四義一為隨三世諸佛所行威儀二為破外道裸形及手捧食三為顯莊嚴威儀能生眾生清淨信心四為隨順慚羞世間心故恭敬自法整肅威儀有餘部說如來著衣離身一指不著佛身正量部說離身一髮經曰入舍婆提大城者此第四化處也依法顯傳祇桓精舍在城南五里自外之內故名為入此城家有九億縱廣十二由旬所以稱大經曰乞食者此第五化事也祇為乞食故入其城依印度法屠人魅膾皆住城外佛雖心等恐生譏謗故入城乞食然如來真體本離食身不假資須但應在人間示同人法是故不食現食亦欲與諸弟子作其儀軌耳此有二意一為省事行道二為福利群生復有四義一為利益貧苦厄難不得自在及老病者自往行乞令得下種為解脫因二為出家有高慢心及貴姓等不能行乞為破此故自行乞食三為斷著樂之諦佛自行乞令諸弟子恆習此行四為顯知足如來雖有天人上供佛不樂著躬行乞食廣說因緣有二十種如樂莊嚴纓絡女經廣說依瑜伽論第八十六卷說由十因緣如來入於聚落乞食一者當顯杜多功德故即舊言頭陀聲訛耳二者為欲引彼一分令入乞食故三者為欲以同事行攝彼一分故四者為與未來眾生作大照明故乃至令彼暫起觸證故五者為欲引彼粗弊勝解諸外道故六者為彼承聲起謗故現妙色寂靜威儀令其驚歎心生歸向故七者為彼處中眾生以其少功而樹多福故八者為令懷信放逸深生恥愧雖用小功而獲大福故如為放逸者懈怠者亦然九者為彼盲聾癲狂心亂眾生種種災害皆令靜息故十者為令無量無邊廣大威德天龍八部等從如來至所入家深生羨仰勤加賓衛不得惱害故經曰於其城中次第乞食已者此第六化等也亦言如理此有二種一世間如理二法如理世間者若捨富從貧即益貧不益富捨貧從富即益富不益貧捨富從貧故大迦葉所以被呵捨貧從富故須菩提所以置鉢今不簡貴賤但次第行乞隨順世情世間如理也法者隨及來施即受不及者更不迴取順諸佛儀心境平等是法如理經曰還至本處者此第七化滿也乞食既足還向祇園故云本處若約行者本處有三一凡夫二乘凡夫未斷惑業於三界中升墜不定不得名本處二乘雖斷皮肉得出三界亦未得本處二者菩薩登地以上分得本處以上地勝進未極故三者如來證得道後無相法界四智圓滿方是本處然佛食處有二一白衣家二在精舍今即乞已還至祇園隨諸佛法取鉢中食分為三分一分置草上施陸地眾生一分置水中施水中眾生一分自食問曰佛既實不食所以言食竟歸何處答大智論云有大力諸天持至十方給施大眾施作佛事也經曰飯食訖者此第八化終也然金剛之體豈資於食為益眾生現同食也上八句外化竟經曰收衣鉢者此第二內靜也上欲令異生生福故所以行途而乞食今欲令異生生智故所以入靜而欲說也三意一屏慮二清身三正靜此屏慮也制僧伽梨衣為入聚落受四天王鉢為貯資糧至處本故衣須收食事訖故鉢須置經曰洗足已者此第二清身也向既遊步所以穢足今還靜攝所以清身此有二義一者法身道前道後體性常淨不論盥洗二者生身示同人法表清淨相故須洗之然三世佛行時恆有蓮華捧足坐時自有師子之座而有斯見但為釋迦出於濁世異生垢重不感見也毗首吼佛時蓮華恆現亦為異生福德所致今釋迦行時雖不現華然足不著地履水行塗並不污足今言洗者終為弟子之軌也經曰如常敷坐結跏趺坐者此第三正靜也兩重一靜儀相二靜體相此靜儀也坐有二義一所坐法二能坐人此各二種一者生身佛即丈六身是能坐人敷師子坐等是所坐法順三世諸佛所坐之法故曰如常二者法身佛能坐是如如智所坐是如如境境智是一逐義為二智即如境境即如智理無差別故曰如常跏趺坐者正明坐相此怖魔坐也智度論曰見畫跏趺像魔王尚懷怖何況入道人安坐而不動若約生身身居法坐若約法身即智安於境前即化身後即法報依瑜伽師地論第八十六卷說由八因緣如來入於寂靜天住一者為引樂雜住者令入遠離故二者為欲以同事行攝遠離者故三者自受現法樂住故四者為與大族諸天示同集會故五者為以佛眼觀察十方世界現大神化隨其所應作饒益事故六者為令諸聲聞眾見於如來深生渴仰故七者為顯諸大聲聞於所略說善能悟入故八者勸捨樂著戲論製作言辭故經曰端身而住正念不動者此第二靜體相也端身而住即靜相表心不亂亦大品經中直身之義正念不動即靜體亦大品中入三昧王定義此明如來心無散亂故為靜體也亦可端身而住即生身靜正念不動即法身靜又前靜儀即生身不動後明靜體即法身不動又復正念有三一外道修定至非想還退失故非正念二二乘未到極處非正念三佛具三事是正念一道前如如是因正二道中十地十度是行正三道後究竟是果正此由因正故能行正行由正行得正果所言正者即二空理能通達此理故名正念不動者有三一境二斷三果境有三種謂凡夫執常以有為境二乘尚斷以無為境佛行中道以二空為境二空為境故異外道二空不無故異二乘有佛無佛性相常住故云不動斷不動者謂外道諸仙伏惑非斷還流轉故非是不動二乘唯除皮肉不斷心障亦非不動佛三障都盡法界顯淨故云不動果不動者即一切智滿足也又復前來廣明如來身業發起正念不動即意業發起又前明洗足即身清今明不動即意淨此明如來遊神正定審理觀機密加眾集更無餘想故云不動此即以身端表心不動也故無著論曰世尊何故以寂靜者威儀而坐也顯示唯寂靜者於法能覺能說故謂依證起也經曰爾時諸比丘來詣佛所者此第二明弟子發起二重一人二儀此第一發起人也爾時者有八一如來出定時二佛欲說法時三大眾事善知識時四聽聞正法時五持護所聞時六決除疑惑時七調宜曲見時八通達深義時故言爾時此諸比丘即上所舉千二百五十人各逐所宜隨便行道今蒙加召故來佛所也問曰唯下經文有四眾八部今何意但言比丘來耶答有五義一勝諸眾二先得道三常近佛四共佛住五能持法十二部經是其傳故餘眾不爾故舉比丘來佛所者一切弟子若來佛所有五利益一未聞二聞得清淨三難解者決四見諸天形五得無上法利各詣講堂故云來至也經曰到已頂禮至坐一面者此第二發起儀也依智度論禮法三品頭頂著地上禮也頭不著地中禮也直揖不跪下禮也今言頂禮表佛德尊及自利益然弟子敬師有三時一晨旦用楊枝竟先問誶禮拜師竟後方聽法二中復三初夜依真諦說此三竟表三位一道前在信位已上二道中即十地三一生補處今至佛所正是道中非前非後退坐一面者此坐也恐喧大眾所以退坐上來明發起序竟初六句辨其通序次佛及弟子廣明別序總顯興致之由竟經曰爾時慧命須菩提者第二正明經體兩周第一明菩薩行體第二為斷菩薩行障初周先請後答此請也無著論釋何故上座須菩提問有六因緣一為斷疑二為起信解三為入甚深義四為不退轉五為生喜六為正法久住故具此六緣即般若波羅蜜令佛種不斷也云何不斷謂有疑得斷故如下廣辨有樂福德心未成熟者聞多福德於經起信故已熟心者入甚深義已得不輕賤者修行受持有多功德不退轉故已得順攝及淨心者於法自入及見生歡喜故令未來大乘教久住廣如說論又釋上來由序既興宜應即說但沙門幽秘事藉人弘若不請而談明問法之流不生難遭之想故須請也請內三重一請儀二稱贊三正請請儀五重一請人二所在三避席四表敬五示專此請人也慧命者難德也謂無流勝解順空不斷以此為命故云慧命或云淨命即離五種邪命如無上依經及諸經說若在家人五種不淨一賣刀仗二販魚肉三貨生口四造毒藥五酤酒諸以斯存命故非淨命出家離此以慧為命故云慧命又慧非諸過亦為淨命或言長老謂年尊說廣亦是美行之異名耳今言具壽須菩提者此云善業或云善吉或名空生今言善現義亦非異於五百弟子中得無淨定解空第一令對說般若然須菩提位是聲聞智慧狹劣世尊前來未有言及何能輒請豈不蒙加能然也經曰在大眾中者此所在也即向來詣佛所眾中也經曰即從坐起者此避席也但尊人重法理自不可端拱況即事請道而不避席經曰偏袒右肩右膝著地者此表敬也既有師資示有軀策亦是隨國法即以右袒為恭故云偏右也屈曲伏從示無違相故云著地經曰向佛至而立者此事專也斂容祇仰顯有專一之志前言著地今復云立此示矛盾不知何定既欲聽法立不應久故云著地亦可將請先起所以云立正述所請故還著地也依能斷經著地即請無其立文經曰白佛言希有世尊者第二稱贊先總後別此總歎也一以如來難遇二以功德超殊故云希有經曰如來應供正遍知者此第二別贊兩重一有三句贊內德二有兩句贊外化具斯二德是故希有此贊內德也乘如實道來成正覺故名如來如即真如來曰無分別智如者不異為義來以主處為功三世諸佛皆以無分別智乘真如道來成正覺故名如來智斷具足堪受供養故名應供知法周普稱實不邪故名正遍知經曰善護念諸菩薩善付囑諸菩薩者此第二兩句贊外化也善護念者依無著般若論釋佛證正覺轉法輪時化深行菩薩善付囑者於佛般涅槃時命化淺行菩薩然善者巧也故論曰巧護義應知善有三種一善智慧二善境界三善方便善智慧者世親論云謂於菩薩身中與智慧力故云何與力如菩薩求菩提亦令眾生同行此法故善境界者論云令成就佛法故佛法者是如如境令成就者即令通達也此二與自行善方便者論云又彼菩薩攝取眾生與教化力故即是念眾生同菩薩所行即與化行也護者防其自身與前二善念者緣其所化與後一善又善智慧者即真實般若善境界者即二空之理此二令自分成別本云善護念諸菩薩摩訶薩由無上利益故即令契二空也善方便者即慈悲般若兩法並行此一令化他俗然化力有三一神通輪二記心輪三正教輪神通變化故能使背邪以歸正記心言實故能使除疑以生信正教顯理故能令捨惡以修善也故云善護念付囑者付即將淺行以授深行囑即令深行以度淺行論云謂於得未得功德中懼其退失付授智者故又云得不退者不捨大乘故此令守自分未得不退者於大乘中欲令勝進故此更令增進也此有二人一深行二淺行亦有二一空行即般若二有行即慈悲修空自進修有化他般若即不住道慈悲即住道淺行之人緣上地慈智能雙進二行一者仰緣智但是似二者仰修慈復未真此道約地前名為淺行若大地已上真證行成即是深行故名善付囑真諦譯經云善付囑菩薩摩訶薩由無上教故即令化淺行也依無著論此二句顯示種姓不斷案令深化淺展轉相教故不斷也言菩薩者此云覺士覺有四義一應覺是理二正覺是智三覺覺分是戒定等四令覺即十二分教初一斷德次二智德後一恩德士有二訓一事二理謂以覺事而理化故名曰覺士菩薩者真諦云十行已上是菩薩雜二乘心故十迴向已上名摩訶薩捨二乘心故又七地已下是菩薩行雜道故八地已上名摩訶薩行不雜道故經曰世尊云何菩薩大乘中至三菩提心者第三正請四重一問心地位二云何住問信樂位三云何修行此問見位四云何降伏此問立位又解初問十信位二問十解位三問十行位四問十迴向位又初問信樂地二問見地三問修地四問果地又初問為總後三為別亦可總為立本別為正問謂菩提心是大乘之本亦可菩薩者問機發心問本住問其位修問其行伏問其解此為總也云何菩薩大乘中發心者須菩提上歎如來善能護付即問此諸菩薩云何發心故無著論云何故唯問發行菩薩乘為三種菩提差別故大乘者何者是乘體而云大也大乘者如十二門論說大乘深義所謂空也此般若論云大乘者謂法無我真如故此皆以理為乘體或言乘六波羅蜜遊法性路趣菩提座此以福智二行以為乘體然萬法皆空而獨徵乘體者未可然也何者若以乘門明法知法非乘但空理是乘所依福智二行是乘作用佛及菩薩是秉乘之人然人無別體正以行為體行不自成契理而就但理外無行行外無人而人能秉行行能入理三事和合總說為乘大者乘雖獨絕非小不彰故論云摩訶薩者於三乘為上瑜伽菩薩地中明菩薩乘與七大性共相應故說名大乘無著論亦爾一者法大性謂菩薩方廣藏二者發心大性菩提心三者勝解大性謂解方廣之教四增上樂大性謂住初地五眾具大性謂福智具足六者時大性謂三阿僧祇耶七者大性謂得菩提果解者多以四義來釋一者體大二者大人所乘三大人所證四者能成大義此四之中有體用兩分因果遍舉自他二行故曰大乘若泛說大乘始從發心終至佛地皆名大乘今所言者是初地已上聖位大乘何以得知下論偈云此乘功德滿若泛論大乘滿足唯佛今具廣等四心何得言滿故知此滿唯是初地已上下言發心亦同此釋故言大乘發阿耨菩提心者阿名無耨多羅名上三名正藐名遍後三名知菩提名覺總曰無上正遍知覺正是如理智遍是如量智知是無分別智覺是無分別後智如理智緣真故言正如量智緣俗故言遍無分別智斷二無知故言知後得智出眠夢之表故言覺此四即是佛果起心求此故名發心此立本總問竟經曰應云何住云何修行云何降伏其心者此第二別問正請也依真諦譯經第三問云云何發起菩提心此問中但請其因而不請果者此經顯大乘法門菩薩正行所以請因由其因成必得果故下雖舉果但為明因耳泛論大因依佛性論有其三種一應得因二加行因三圓滿因所應得者謂菩提心所可行者謂十度行所修滿者謂三德果發心因乎佛性起行因乎發心果圓因乎加行故以佛性為應得之因發心為加行之因加行為圓滿之因此中三問具問二因初云何住此請加行因即菩提心言欲發菩提心住何心而成發次云何修行此請圓滿因即十度行言欲修菩薩行起何行而成修後云何降伏其心此重請圓滿因言欲滅正行障降何心而成滅又云何住者自分滿足守位不退云何修行者隨事造修勝進增長降伏心者於事不著令心調柔此之三門若以位論地地皆有別如前說經曰爾時佛告至善哉善哉者次下正答先答緣後正答答緣中五重一贊二述三誡四許五願此第一贊也何故須贊者上請問中善吉問佛菩薩行然大眾心疑以其小乘恐向歎問未必當理故言佛贊除眾疑心明其歎請合理多益故曰善哉故無著論云以善問故應稱善哉然善吉向前欲請先歎佛而後問佛今將說亦先贊而後答此乃互為影響耳經曰須菩提至善付囑諸菩薩者此第二述也牒上利也所稱合理故云如說也經曰汝今諦聽至如是降伏其心者此誡許二門也但道法幽玄聽須詳審故先誡之令諦聽也當為汝說等者雖言許說未知說何故牒上請如菩薩等經曰須菩提至願樂欲聞者此第五應願也善吉既聞許說情深渴仰故承命欲聽故曰樂聞經曰佛告須菩提諸菩薩生如是心者下次正答三重一立經體二顯經用三勸修行立體兩重一依問正答二因答斷疑正答則標宗略說斷疑則開宗廣說正答三重一答云何住二答云何修行三答云何降伏其心答住內先總後別此總教也生如是心者即歎願四恩心也世親論曰若菩薩有四種深利益菩提心此是菩薩大乘住處案此大乘以菩提心為本故名住處四種心者一廣大心二第一義心三者常心四不顛倒心此四種心初二是慈悲門後二是般若門前中初一是無邊慈以發心廣遠故後一是無等慈以凡小不能作此利益故後二心中初一是不變異般若即是常心故不變異以不二故名常不二者論云菩薩取一切眾生猶如我身故後一是如實般若即不顛倒心不顛倒故如實若有我見即無般若若有眾生見即無慈悲無悲智故則非菩薩今明菩薩有悲智故心不顛倒不顛倒故如實也又復前之二心明度而能普即以廣降狹後之二心明度無所度即以無降有以廣降狹是伏二乘心以無降有是伏凡夫心伏凡夫心顯有智慧伏二乘心明有慈悲經曰所有一切眾生眾生所攝者第二別序四恩即為四分先明廣恩心三重一標二釋三結此總標也所有一切眾生總收法界眾生眾生所攝者簡去非情有生皆攝經曰若卵生至非無想者此釋也無著論曰差別說也三重一舉四生二色無色三有想無想此列生類也即是四生地論云生依至差別無著論云受生別故雜諸根起名生生別不同有其四種依殼而生曰卵含藏而出曰胎假潤而興曰濕欻然而現曰化此列生類也人畜二趣並具四生餓鬼唯有胎化諸天地獄一向化生若以四生對六趣六趣狹而四生寬以中陰化生非趣攝故若有色若無色者此列界類無著論曰依止別故界者別義一欲二色三無色若有色即攝下二界眾生若無色即攝上一界眾生何故如是以欲界必並有色色界其必無慾無色一界無色無慾故若有想若無想若非有想非無想者此列性類性者體義一切眾生以想為性無著論曰境界所攝別故有想者即有心而粗無想者即無心而寂非有想非無想者即雖有心而非粗非寂非粗故異有想非寂故異無想故言非有想非無想也言若有想即攝七有想定及欲界眾生若無想即攝二無想定及無想天眾生非有非無即攝非想非非想天眾生俱舍論云由想昧劣謂無明勝想得非想名有昧劣想故名非非想此並廣心之境欲求作佛必先依之而發心也此界性二類十地論名粗細差別經曰所有眾生界眾生所攝者此結佛說故無著論曰謂上種種想住眾生界佛施設說也經曰我皆令入無餘涅槃而滅度之者此第二明第一恩心也三意一第一心二第一法三第一事我皆令入者此能施恩即第一心也無餘涅槃者此所施恩即第一法此有二義一三障永盡二德滿無缺故號無餘不同二乘但亡身智名曰無餘涅槃者翻為滅度亦言寂滅亦言成就大樂亦曰清涼而滅度之者欲令眾生皆證此樂故言度之此第一事也無著論問曰何故願此不可得義論曰生所攝故無過彼又問曰如所說卵生等並入願數者彼卵生濕生無想及非有想非無想等則不能入云何能令一切眾生入涅槃也有三因緣故難處生者待時故非熟者成熟之故已成熟者解脫之故彼又問道何故說無餘涅槃界不直說涅槃彼自釋言若如是便與世尊所說初禪等方便涅槃不別故彼自以丈夫力故無佛亦得但非究竟故案此初定等凡夫外道及劫燒時同皆得故彼又問云何故不說有餘涅槃界釋云彼共果故自以宿業又值佛說而得果故又非一向身苦有餘故說無餘前來二心相唯慈悲非無智慧前之廣心雖與人天之樂即是下恩與二乘樂即是中恩今與大涅槃無上之樂故是第一恩也經曰如是滅度至即非菩薩者此是第三常恩也三重一牒前二心明俗有慈悲二正辨常恩明緣真有智慧三釋所以如是滅度者牒第一心無量無邊等者牒廣大心由此二心是慈悲故處有不息也然無量有四義一者約事名無量由菩薩恆起大悲及正勤自度令他度無量眾生皆得涅槃是事無量二者時無量於無量劫自度令他度無量眾生得涅槃故三者方便無量於向劫中由悲智故隨眾生根性種種方便現三乘教度脫之故四者性無量眾生有三性二性有量一性無量遍計所執性依他起性是有量虛妄法故圓成實性名無量真智境故一切眾生約前二性則無般涅槃與如如智相違故約圓成實性得般涅槃以四德為體與如如智相應故由約此性是無量故得般涅槃又無量者豎通三界無邊者橫括十方實無眾生得滅度者由智緣真物我一體此正常恩常有二種一者常體謂人法二空性無遷變故二者常用謂處攝生化用不斷故世親論云菩薩取一切眾生猶如我身以此義故菩薩自身滅度無異眾生得滅度者此由悲故己外無異生智故異生外無己故曰實無得度無著亦同此也依文殊般若經明眾生界不增不減故無得滅者經云假使一佛住世若一劫若過一劫如此一佛世界復有無量無邊諸佛如是一一佛晝夜說法心無暫息各各度於無量恆沙眾生皆入涅槃於眾生界亦不增不減何以故眾生定相不可得故十方亦爾何以故至即非菩薩者第三釋所以也前言化生入滅後云無生得度二言矛盾故責何以即自釋云若菩薩有眾生相即非菩薩由己外見眾生故非菩薩故無著論曰若菩薩於眾生所他想轉非自體想不名菩薩故世親論亦同彼云若菩薩於眾生起眾生想不生我想則不應得菩薩名如是取眾生如我身常不捨離是名常心利益此示廢異智經曰何以故非至不名菩薩者此第四明不顛倒思己外見生竟有何失而言非故即自釋言若菩薩起眾生相等則不名菩薩我等四執是分別分別之心即菩薩正障既有正障故非菩薩今明菩薩無我等相則自惑已亡心無顛倒故能常化也初我相就內身破次三相就外境破有我相故無涅槃若有眾生等見故無慈悲故非菩薩今無四見明有悲智有悲智故則是菩薩故無著論曰若以煩惱取眾生命人想轉彼則有我想及於眾生中有眾生想轉菩薩於彼不轉已斷我見故得自行平等相故行謂五陰行信解自他平等故經曰復次須菩提至行於布施者此下第二答云何修行然無著世親名高印度奇才卓犖昆季師資並學冠當時位隆上忍悲雲外作慧炬內融注法澤而洽群萌秉智燈而輝巨夜皆以修多羅藏秘密難通各暢述所知制茲經論雖復筌蹄異唱闕旨無違庶返迷方殊途一致耳然世親所制後魏翻行無著注述後隨方釋前論則行之已久取則者成林後論乃創始流傳知聞者適有一二今先依無著後述世親師遞相承以為其次無著論曰彼諸波羅蜜有二種果一未來二現在案論即以二果釋經三句未來果者施得大福報戒得釋梵報忍得大伴助大眷屬進得果報不斷定得生身不可損壞慧得諸根猛利於大人眾得自在等現在果者得一切信敬供養及現法涅槃等云何釋經三句論云若求未來果故行施為住物行施如所施物還得彼物果此為所除經言不住於物應行布施物即事也此不住者是能除無著論云此為依義顯示對治住著故應行施者此為說相謂說檀等故又云若求未來尸羅等果故行施為有所住行施此為所除經言無所住應行布施無所住者此是能除案能求即有取障能除即無相修此之兩句但約未來果以釋論云若求現在果信敬供養等故行施為住色聲香味觸行施此為所除故經曰不住色等此為能除若求現法涅槃故行施為住法行施此為所除故經言不住於法應行布施此為能除此一句約現在果以釋此解與舊釋碩反應知若依世親論釋以一偈攝此三句經文偈云自身及報恩果報斯不著護存已不施防求於異事故攝三句者論曰不住於事者謂不著自身無所住者謂不著報恩報恩者謂供養恭敬種種等門不住色等者謂不著果報下半偈解不住意此三句經即為三別相傳解釋前二句約現在後一句約未來正解修行有三即教離三障一不行障二僻行障三倒行障依世親論初令不著自身即離初障次令不著報恩離第二障後令不著果報離第三障即為三重不住於事者此初句也即不著自身住猶是著論云謂不住自身故事著五陰身事此有二種一以菩薩善知自身本空無物但是假名二知身無常不久磨滅何足可保是故不著若著自身則有二過一畏身不活擁財向己不肯布施即是慳貪二者設行布施心有取想不到彼岸即是其障今既不住行施即離初障也經曰無所住等者世親論云不住報恩報恩者謂以少施而求大報若報他報名為僻行一者因僻不以悲智為方便故二者果僻不以佛果為所求故今既以二行為因求三德果故離第二障也故無所住也此二據現在也經曰不住色布施等者論曰不著果報此一據未來無著約現在正報是受體在法塵依報是受資即五塵生死之受實苦計樂所以是倒為生受體求受之資故亦名倒今令不住五塵即捨依報不住法塵即捨正報為求佛果德而行施者即菩薩正行也問行乃塵沙何故唯論布施答為明菩薩行者若行一行即攝一切行故舉一檀以攝諸行也世親無著皆以三檀具攝六度故論說言六波羅蜜所攝一切檀那性故一者資生檀攝布施一度此名體相當也二者無畏檀攝戒忍兩度世親論云於已作未作惡不生怖畏故於已作惡布施捨心者無報怨心故不令他怖忍施無畏施也於未作惡不生怖畏故者而不犯戒起惡加物戒施無畏也三者法檀攝進定慧三度身心不倦故是進善知識故是定如實說法故是慧故論偈曰檀義攝於六資生無畏法此中一二三名為修行住此答云何修行竟經曰須菩提菩薩應如是布施不住於相想者自下答第三降伏心問雖答伏心即是成上修行上所以不著三事者良由內有不取相心故若依外國疏釋此下但答第三問不兼成上二問然束為兩節初明發起無心可以相下明發起無疑心於中五重一立本二利益三舉譬四合喻五勸行此立本也應如是布施者應如上不見三輪行無相施不住相想者謂施者受者財物相此為所住即所取也想謂能取三輪想此謂能住即能取也相是遍計所執性即相結想是依他起性即粗重結此二種結即菩薩正障若作無性觀觀遍計所執本末無相故相結滅即不住相也觀依他本來無生故粗重結滅即不住想也若行諸度離諸度相想即降伏執相心成無相行也經曰何以故至不可思量者此第二釋利益也何以故者住相何損捨相何益而今不住故又若離施相想者云何能成施福故即釋云若菩薩不住相布施其福德聚不可思量此答明福難量也何者有相是俗無相是真有相行施但感世間之報其福有窮無相行施遠招出世之果其福無量此於三輪雖離相想非無平等惠而行布施故不可量也經曰須菩提至後佛言如是者此第三舉譬前雖法說義猶未彰故引空為喻成福德多故無著論曰如是建立不住已或有菩薩貪福德故於此不堪為令堪故世尊顯示不住行施福聚甚多猶如虛空有三因緣一遍一切處謂於住不住中福生故二寬廣高大殊勝故三無盡究竟不窮故若相傳解空有三義故不可量一性常二體一三容受無相布施類空亦爾一常而不變二眾相寂滅三體合眾德備此三義故不可量也文中兩重一問東方二類餘九為彰因滿如空無限故東方三重一問二答三述此問也東方空體論遠近可思量不答述可知次問九方類以可解經曰須菩提至不可思量者此第四合喻無相布施如空三德故云亦如是經曰佛復告至行於布施此第五勸行也但應如我上來教汝離於相想而行施者必成大果功德之聚如空無限也上來答問標宗略說竟經曰須菩提至見如來不者此下第二因答斷疑即開宗廣釋世親論曰自此以下一切修多羅斷生疑三重一約正行斷疑二約正教斷疑三約正果斷疑此第一約正行也六重一問二答三釋四印妄五顯真六結實此第一問也疑者云若為菩提而行施者此即有相若無所為即施空無益前來既行忘相之深因應招無相之妙果今既見有相之身則因非無住明矣為斷此疑故為斯問也相即三十二相可以此相見真體不佛及問善吉者凡有三義一明理體平等契者便通若佛獨說似有我見與居己無我故令弟子說也二為接下情若佛獨說則近行之流咸生自絕既見下人能說則便依修故地論云何故菩薩說增長諸菩薩力故三明畢竟斷疑要須反問令其取解也經曰須菩提言至得見如來此第二答也先總後別明須菩提承佛加被善知法身體是無為但可顯了非修所得故云不可以相成就得見如來若以相見如來有二過失一同輪王有三十二相故二同有為有三相故故論云何以故如來名無為法身故經曰何以故至即非相者此第三釋顯何以故者問前不也意即釋云如來所說相即非相故所說化身俗諦相即非法身勝義相故云即非相也經曰佛告至皆是妄語者此第四印成有為虛妄也前明善吉說妄稱理下如來自說成前義實故世親論云示現彼處三相無故案彼處即法身處離生住滅故言無凡說俗相非真實體故云妄語無著論云第一義中相具足為虛妄相非具足不虛妄經曰若見至非妄語者此第五顯真也若見有為之三相非是無為之實相為人說者此非妄語此達妄入真也經曰如是諸相非相則見如來者此第六結實也如是諸相非相者牒前化相非真則見如來者結實明菩薩善知如來法身即相無相離相證實故見如來故無著論曰此為顯現謂相應三昧及攝散心時於彼相中非相見故世親論云菩薩如是知如來為佛菩提行於布施此明菩薩如是通達行離相因得無為果不名執著也斷初正行疑竟經曰須菩提至生實相不者次第二約正教斷疑先問後答此問也疑者云前說不住之因既不可得則深而難行後說無相之果又是無為則妙復難得是則如來在世深行難解乃得利益未來末世機根淺薄頗有聞經行無住之深因得無相之妙果不如其不得則如來有徒說之過於中五重一標章二舉信三時節四聞教五重問可知經曰佛告須菩提至生實相不者此答也答意者雖復末世必有信者謂凡聖二人具足三德於此深義決信不疑即成如來不空說法也答中先遮無後示有此遮無也佛將說有以杜疑先遮無以正問故言莫作是說經曰佛復告至法欲滅時者此示有也示有中先示比信後示證信比信則依於戒福慧又初明戒福舉供諸佛後明智慧則說二空良以福從田生智由境發田中之上莫勝如來境界之深豈過空理是以舉佛勝田彰福廣大明空境妙顯智幽微比信六重一信時二信德三信依四信體五信因六信果此第一信時也未來末世法欲滅時者佛者佛滅度後第五五百年也依大集月藏經第一五百年解脫得堅固第二五百年禪定得堅固第三五百年智慧得堅固第四五百年造塔寺得堅固第五五百斗諍堅固若以正像皆千年者即第五五百年經云末世故若正法只五百年者則第四五百年經云法欲滅時故無著論曰正法欲滅時者謂修行漸滅時也則第四五百年經曰有持戒修福德智慧者此第二信德也依無著論云戒等三學與福德對彼智慧並是福門而兩說者戒是止相福修義所以二說持戒者清禁自居防息三業修福者隨事造修備積眾善此二即比信之德無著論曰功德者少欲等功德等為初乃至三摩提等即福德也智慧者鑒照空有令心無滯即證信之德也經曰於此修多羅章句者此第三信依也修多羅即此經也章言大分句論委細前說不住因為一章後說無相果為一章故云章句者因中不住色等之流果中相即非相之類依無著論修多羅句說者謂所有義則以所詮為說能詮為句經曰能生信心以此為實者此第四信體也信行無住之深因必招無相之妙果又信法有實益實有信人經曰佛復告至而種善根者此第五明信因兩重一反釋二順解此初也兩重一非少供諸佛二少種善根樹因久也經曰佛復至種諸善根者此順釋也一供事多佛二多種善根明植福深問前信德中云持戒今言供佛者何答持戒清潔稱可聖心則為法供此無違經曰聞是至生淨信者此第六信果信果有三一信微二證重三因誠此初信微也顯信少而福多故云乃至一念也經曰須菩提至是諸眾生者此第二證重也世親論曰彼持戒等人諸佛如來非見果比知事此何為福德正言殑伽此翻為許河中沙數世界一沙為一世界經曰須菩提至何況其沙者第二諸河是河尚無數況乃其沙經曰佛言至得福多不者此第三問施也一恆之沙為第一多一沙復為一河為第二多諸恆之中復各有沙為第三多諸沙之中一沙復為一界為第四多若人施寶同於此所生之福得為多不經曰須菩提言甚多至得福甚多者此第四答施也寶多福勝故甚多也經曰佛告須菩提至阿僧祇者此第五比勝正明經勝用也此明施寶雖多但是有流而生福少持經雖少能感菩提而生福多此乃染淨懸殊昇沉不類故言勝前無量也無著論名此一段為攝取福德也經曰復次至如佛塔廟者此第六釋勝明此經之勝成生福多也五重一明經力能令物尊二辨經體從真流出三顯經教諸佛同說四舉經用為滅惑本五論經福諸善中勝初能令物尊四重一令處尊二令人貴三釋人貴四釋處尊此令處尊也世親論云一者所說處隨何等說此經令生尊重奇特相故無著論名等供養經曰何況有人盡能受持讀誦此經者此第二令人貴也世親論云二者能說人隨何等人能受持及說以尊重經論故何況者一以無情況有情謂以地況人也二況多以一偈況盡受也地無靈說處尚令尊重人既有識持者深須敬養也世親論云非七寶等隨何處捨隨何人能捨如是生敬重故案捨寶人處不令人貴故世親論云此法門與一切諸佛如來證法作勝因故案若不持說不得菩提由此義故處人尊貴也經曰須菩提至希有之法者此第三釋人尊也是人者即持經人也得菩提果名成最上物不能並故云第一世間所無名為希有無著論名難作經曰若是至似佛者此第四釋處尊也則為有佛者一解云經是正教法身若持在心是人身中即有法身此以持經之人為處又解則為有佛即指持經人為佛佛本在世自證此法為人弘宣若人受持此經隨分取解名為自覺為人演說則是覺他障雖未盡亦得名佛故經云當知是人坐我坐處即是如來也又有經之處則為有佛佛教不異經教也聖既居中處可尊佛者此明傳經益也既等如來故勸供養宜作佛弟子者即是菩薩有佛顯有能說有顯有能受兩聖居中處可尊也無著論名起如來等念經曰爾時須菩提至云何奉持者此第二明此經體從一雙問二雙答三雙釋此雙問也所以此中雖復對佛演說而未聞其名既見有大願欲夫證真如者得真般若從真般若流流大悲從大悲流化身從化身流此經故此法門流也經真流故持少福多寶非真流施多福少欲顯此情初當何名此經約文以求目後我等云何奉持約經曰佛告至波羅蜜者下雙答先答初問宣實實之為名本證實者能流於名尋名之所流還詮證實之智中佛自答名金剛羅蜜雖是世間法能心今言布施及攝六度也上來約有住斷疑竟經曰須菩提至應如是布施者此事二約無住斷疑也兩重一約外化二約自行外化兩重一約俗有化二約真無住此約俗有化也疑云若其無住為誰修行若見眾生可為即名住者也今明約俗可言有為故言為利眾生應如是布施案若心存三事則利物有限若能不見三事方為大利也經曰須菩提言至即非眾生者此約真無住也眾生相者即眾生非眾生相者明其體空色心俱不可無相即答言如來說一切眾生即眾生名非眾生者正顯名空體既空也故世親論曰假名及三如來離彼相諸佛無彼二以見實法故明得二空外化耳經曰須菩提至不異語者者次約自行斷疑世親論曰此中有疑於證果中無道云何彼於果能作因為斷此疑者云理中無教云何藉教而能得理此疑從上如來實見今不住而能為因此乃聖者所知非凡能測但依教修也欲顯此行可信可證故舉四語以勸之於中兩意一勸信二防過此說真智實語說四諦即人空如實語說事此乃境有四種故語有四非謂如來語及小乘說摩訶衍法及一切受記以不虛等此何所顯示欲令信如來故能忍於中真語者為顯世諦相故即苦諦實語者為顯世諦修行有煩惱及清淨相故於中實語者此行煩惱此行清淨故案此二語則說世間染淨即集諦者為第一義諦相故即滅諦不異語為第一義諦修行有煩惱及清淨相故即道諦案此二語則說出世間清淨經曰須菩提如來所得法所說法無實無妄語者此防過也前既畏守言失道為防彼故所得法者即二空理不即理故言無實教必順理故無妄語喻興道處無言故捨船之譬作無著論如言說性故執著為遣此故經言須菩提如來正覺法及說無實無妄無實者如言說性非有故無妄者不如言說自性有故經曰須菩提至亦復如是者此第三雙約有住無住斷疑世親論曰復有疑若聖人以無為真如法得名彼真如一切時一切處有云何不住心得佛菩提則非不住若一切時處實有真如何故聖人可得凡夫不得為斷此疑故說斯喻也無著論顯乏受對治兩重初一法喻明有住喻凡夫即外凡也以不定故引入闇以況之問曰外凡本一以常在闇中亦得言人故經云從闇入次三對聖人為出顯凡為人依無著論為報行施便著於事欲樂苦受中不解出離猶如入闇不知我何所趣後一法喻顯無住喻聖人闇以譬惑明即喻智色喻真如若心有住是有惑無智若心無住是有智無惑真雖不隔於惑智其惑不滅不可以證真亦如色雖不隔於明闇其闇不滅則眼不能見色若如是有智者得無智者不得何關真如遍不遍也於中皆初前文可知後喻內如人有目者世親論慧種子明有見體也夜分已盡者世光明者如能治法現前故若如是目譬見種種色者理事斯鑒故云見無著論亦同此說經曰復次至讀誦修行者從上初恆以來至明經用此下第三次勸修行兩重一勸修二美業勸修四重一教因二示果三舉劣四顯勝此教因也於此法門者此修行處即教道也受持讀誦者修行事也世親論云依彼名字得成聞慧此有三種一受二持三讀誦受持修行依持法故讀誦修行依聞慧廣亦名聞慧此則修行為總受持讀誦讀誦是思慧修行是修慧又復受是信修慧又復受持等是智慧門廣說者是慈悲慈悲則外化無著論說受者習誦故持者不忘故論名一段為如來憶念經曰則為如來至功德聚者此示果也知見如前釋悉覺者即分別後智出眠夢之表故言覺此明照俗前顯證真此乃將明修福之轉勝故先言得福之無邊也無著論名攝福德經曰須菩提至以身布施者此舉劣也兩重一捨身二時大捨中先捨後結前明捨身直明持經有慧成就今明修行見理三慧得成以三校量也世親論云以事勝故案即捨恆即百千萬億劫故經曰若復有人至為人廣說者不謗者即信也直爾生信猶勝捨身況能持經固難為喻也又不謗者明信心勝受持誦等明智慧勝廣為人說明慈悲勝經曰須菩提至無邊功德者此第二美業明依此經而修則三慧轉勝近除三障當獲二果未成佛以來備受人天勝報功業成辦多所饒益欲修行之用以勸修行之心也文中有九一境界深二依止大三滿界種四持正法五難信聞六處障八速證果九果報大此境界深也無者所詮之理深心口所不及非凡小之境界也稱量者智慧波羅蜜上極虛空故權衡不能準不可稱量也有等及勝故無邊功德者餘五波羅蜜傍盡十方故弘揚不能測無邊功德也世親論曰非餘者境界故經曰此法門至最上乘者說者此明依止大此成前不可稱義法門者即此般若無相法門運出三乘之表故曰大乘過兩障之外故稱最上無著論云餘乘不及故最上煩惱障智障淨故最勝又為三賢菩薩通說法身故曰大乘說彼報身故稱最上又為地前人說名為大乘以發心故為大地已去菩薩說故名為最上以有三一者下說四諦十二緣等即二乘二者上上說說三無性即一乘此經為發後二乘者說依大人說故又此法門為大乘人學所依處故名依止大又諸故名依止大乘者有五義一者乘體即真如佛性體能出離故二者乘因謂福慧二行能引出真如性故三者乘攝謂一切眾生皆可濟度故四者乘障謂皮肉心三惑是處所離故五者乘果謂無上菩提是乘所至無過此故經曰若有人至無量功德聚者此有滿界種也即三種佛性一自性佛性二引出佛性三至得果佛性初即真如界次是菩提心後明六度行案初即名界後二名種此乃依真如界發心行種故今名無邊無量之福此與三性相應故圓滿界種悉知見者此嘆修行不可思等者別釋無量等菩提者此明持正法正法即菩提菩提名覺覺有四種一應覺謂二空真如應須覺故二正覺無分別智是覺體故三覺分謂度十地及道品等是覺因故四令覺謂十二部教令得覺故初是覺緣二是覺體三是覺因四是用若受持讀誦此經即持令覺依正教修正行即攝持覺分依正行生真智即攝持正覺依真智證真如是攝持應覺攝持即荷擔問菩提非色法云何名擔解云非色故不同世擔及廣度眾生即二處荷負豈非擔耶世親論釋棄擔能擔中立云五陰粗重常惱故名為擔如佛所說何謂擔五陰是擔諸阿羅漢此擔已除以是故言棄擔能擔者是佛法中二種功德擔應擔一者自利二者利他一切諸漏盡不悔解脫等諸功德是名自利信戒捨定慧等諸功德能與他人是名利他復次譬如大牛壯力能負重載此諸阿羅漢亦如是得無漏根力覺道能擔佛法大事擔以是故名能擔案此經亦以自利利他以為荷擔菩提既以悲智為體即為二利經曰何以故至無有是處者此明難信聞兩重一未明小乘難二顯凡夫難若樂小法者即二乘人輪無受大之機故若有我見等即外道此明淨三障謂惑業報無著論名滅罪為人輕賤者立何以故下釋持經之人應可尊重何以為人輕賤故答意先世有後報重罪以此身上聞經持說能轉重業現世輕受未來苦報因即不牽非謂持經招此輕賤也若爾既有重罪何得聞經答以其先身罪福並造既有罪故應入惡道以兼餘福故得聞經若能深達相應輕報亦盡現受人輕為人賤故轉報障先罪滅故障世親論曰及遠離諸障故經曰速證果三重一舉劣二彰勝三比勝燃燈佛前者謂燃燈之前今引長時供佛功德與來世少時持經之善共相比較顯經力勝速證菩提從始至末四事供養故無空過此舉劣也若復有人下此舉勝也後末世者謂佛滅之後別本云於末世五十歲時持經之善勝供佛者何此有四義一者三世諸佛以般若為母故二者供養諸佛多起人相故三者以但生福德佛有限故今明持經發解遠離眾相稱云法供養者諸供中勝持經之福多事世親論云復能速證法故今以事佛福為一分持經福為百分事佛一分及經福百中之一分次以百中一分為千亦不及中之一分後云故云乃至經曰須菩提至疑惑不信者此明得大報兩重一顯因多二明果大無著論云此顯示彼福體及果不可測量故此因多也我若具說者世出世報皆持經得者可名具說今但論出世故名不具所以但說持經得出世報者恐凡小聞說世報近果遠捨菩提永失本心名為狂亂不信即凡經曰須菩提至亦不可思議者此果大也法門果報者即出世間十王三身之果十王思三身大果則體用大而難測論曰成種種勢力得大妙果報故上來第一周明立菩薩行體竟經曰爾時須菩提至云何降伏其心者此下第二周斷菩薩行障先問後答此初問也無著論云何故復發起此初時問也論自釋云將入證道菩薩自見得勝處作是念我如是住修行伏心我滅度眾生為對此故須菩提問世親論曰何故前說三種修行今復重說此有何勝偈言於內心修行存我為菩薩此則障於心違於不住道經曰佛告須菩提至一切眾生者此下答問疑此破障也兩意初慈後智此慈也一無邊慈所及廣遠故二無等慈二乘不能行故已如前釋此第一慈也經曰令入無餘涅槃界者此第二慈也經曰如是滅度至即非菩薩者此下明智前明畢竟智即是常心後明真實智即不顛倒心此初智也三意一標前二心明化俗有慈悲二而無下明緣真有智慧三何以故下釋意經曰何以故至者此第二智兩意一難二通何以故者生猶如我身何故復言無我人等若實無我住修行等也以此推之似當有我而為菩薩何故說云無我等故故云何以實無有法下通也通意始從種性終盡法雲於內心中超我心分別者皆是障道不以此心名為菩薩故曰實無即應難云若起我心非菩薩者起何等心名為菩薩應舉住答通達無我無我法者名為菩薩廣如下說案此一段經文即標上答云何住經文亦應具有修行降伏但義有文無何故如是夫心為行元其心必知有行故略之耳又復前文但遣著末有過故異於前非煩重也故世親論曰若菩薩於自身三種修行生如是心我住於菩薩大乘我如是修行我如是降伏其心菩薩生此分別則障菩提行故無著論中亦同此說又存自者不能忘觀存他者不能忘境其欲自他兩滅者莫若境觀雙盡是故如來標前無度以盡境引令無發以盡觀境盡故絕於所度觀盡故絕於能度所度絕則他我滅能度絕則自我亡二我之執既除障道之累自息若如此豈有一我名為菩薩而發心乎經曰須菩提至三者此第二斷情疑兩重一約菩薩二約如來菩二就化生三依嚴土得記展轉四重一斷有菩薩三如來有得疑四斷如來無得疑有菩薩疑四重一問二答三述四成此問也疑意云若今時菩薩是無昔日亦應是無若昔有者今亦應有昔若無者釋迦菩薩不應依燃燈以得道今若無者彌勒不應依釋迦以受記只可無自體神我菩薩可無非色非心假名菩薩為斷此疑故為斯問前說燃燈今復重說二文何別案前則疑法可取今則疑人能取文雖大同疑則不一經曰須菩提至此答也善吉既玄悟聖旨故答以無得既無所取故得菩薩提者此有二義一者菩薩爾時猶在性地實證無生真理故言無得二者初地已去得無生實證不見一法是菩提而為智證方得授記故言無得所以明此二者此經前後具說二種人故又佛藏華嚴發菩提心等諸經中皆明供佛以有所得故佛不授記末後遇燃燈佛方得授記以無所得故又大品經名字集散十無燒城喻四品中廣明有菩薩無菩薩義五陰十二入十八界中無菩薩三毒十二因緣中無三世六度三十七品十力無畏十八不共法一切種智中無乃至善不善常等諸觀中亦無如是一一法非菩薩諸法和如是說即真說般若如是觀即是真行般若聞如是說不驚不畏即住阿鞞跋致性中後言即空離空無菩薩行般若即般若離般若無菩薩行般若五陰六度乃至實際一一法中無菩薩行般若諸法和合中亦無菩薩行般若如是所見無法亦不可得亦無有生無有無於是法中通達無疑是名菩薩住無生法忍五陰假名菩薩得是法故名行般若此是世俗故說第一義中是無生菩薩得是法故便得授記發菩提心論無解無相無念無取無捨無垢無淨乃至空中名為空若菩薩如是知陰界入性即不取著是名法忍菩薩以是忍故得授記忍如是等說豈有一菩薩體實不空而得授記也經曰佛言如是如是至得菩提者此述也美其言得故署言如是以燃燈時行非上故不得授記經曰須菩提至釋迦牟尼者此成其義也二意一返釋二順成此反釋也授者示其果記者定其時燃燈既遙授以當來明釋迦未即成於囊日故授記燃燈行非上後時者授記後時方得佛也得果也此明有所得故不記經曰以實至釋迦牟尼者此也正以無所得心悟無生忍故燃燈記我得佛也前有所得行非是上今無所得乃名為上有得即地前無得即地上也依首楞嚴經授記有四一不現前授記二現前三發心四無生忍經但列四名不配位地而解者不同就位上下不現前者謂三賢菩薩積行未遠雖未現證宜與授記故現前者謂初地菩薩見解現前而得授記發心者二地已去七地已還發心修道而得授記無生忍法雲悟無生忍時而得授記又解不現前者佛去其不在會者皆亦得佛也現前者即在會面與記也發心者或在外凡或住三賢或在初地當發心時即得授記也無生忍者或在初地或在八地而得記也摩那婆者此云無方行人舊來相傳譯者亦云仍重真諦譯為有意年少如因果經中說善慧仙人因五大夢欲問普光佛於其中路住五百婆羅門論議得勝彼五百各施一銀錢盡用買花如經具說佛授善慧記已猶見善慧鹿皮衣如來欲令捨此服儀即便化地以為淤泥行而地濁深心自念言云何乃令千輔輪足蹈此而以用布施不足淹泥仍又解髮亦以覆之如來即便蹈之而度因記之曰汝後得佛當於五濁惡世度諸人天不以為難必如我也善慧即時解一切法空得無生忍身升虛空說偈贊佛訖白普光佛言我昔在山得五奇夢一者夢臥大海二夢枕須彌山三夢海中一切眾生入我身肉四夢手執日五夢手執月願為我說此夢之相普光佛說夢臥大海者汝身即時在於生死大海之中枕須彌得般涅槃相一切眾生入身肉者當於生死大海為處手執日者智慧光明普照法界手執月者以方便智入於生死以清涼法化導眾生令離惱熱此夢因緣是汝將來成佛之相也經曰何以故至即實真如者此第二斷無如來疑疑云前舉燃燈明法不可取今舉燃燈明人不可得若爾本以菩薩修萬行故而得菩提故名如來今既無菩薩得法將非一向無如來故故言何以故此疑意謂行未滿果未圓未成佛者是法身為斷此疑即答云如來者如來即實真如也此明法身如來真實不倒不倒故如理不同報佛報佛修得法佛性淨實者非顛倒義故真如者不變異故稱理故不倒常故不變此明人無別體即以法為人未證故名法如已證故名如來名雖不同其體一也法既實有即知如來不無無著論曰如清淨故名為如來清淨如名為真如經曰須菩提至不實語者此第三斷如來有得疑先舉疑後正斷此舉疑也疑云前無菩薩故可使無得菩提者今既有如來則如來自證菩提疑不當理故不言實經曰須菩提至得菩提者此正斷語前說菩薩得菩提彼為不實今謂如來得菩提此實無有法佛得菩提也菩提以真如為其體真如者妙有妙無非因非果言語道斷心行處滅難以覺觀求不可以身心得而謂如來得之於色心求之以覺觀此不實也故言實無有法佛得菩提故維摩經云菩提者不可以身得不可以心得寂滅是菩提滅諸相故不觀是菩提離諸緣故經曰須菩提至三菩提者第四斷如來無得疑四重一標有得二遣虛實三示虛實四譬虛實此標有得也前明如來無所得或謂如來一向不得菩提為斷此疑來所得菩提如來者即報身如來所得菩提者得報果也世親論云非實有為相故報佛如來非三相故有為相者謂五陰相彼菩薩法無色等相故經曰於是中不實不妄語者此第二遣虛實也疑云前言有得非實今言有得非虛此何謂也為斷此疑故明報佛菩提無世間虛妄等相可得故不實而有法界淨色可證故不妄語又彼法身如如非世間虛妄等相故不實即是菩提相故不妄故世親論偈言彼即非非人以不虛妄故不妄語若以言取即實不實即遣有相中有謗不妄即遣無相中無謗經曰是故如來至皆是佛法者此第三示虛實初引說後正示此引說也一切法者謂真如法是一切諸佛所得法一切法中如如為自體故問真如應一云何言一切解云如如非多法故言一切故論云彼法如來所證故言一切諸佛法故此舉所得示不妄語經曰須菩提至名一切法者此正示虛實也然真如是諸法之通體諸法於如有違有順順則真持違則真離所持真處有所離者真處無真處有者是一切法亦名佛法真處無者雖是一切法而非佛法故云即非一切法此則一切世妄等法非如如真實法故是名一切法者即是如如真實法故此舉不得示不實也故無著論云顯一切法法如清淨故如者遍一切法故經曰須菩提譬如有人其身妙大者此第四譬虛實也先立後答此立也前明大身顯報佛無取今辨大身彰法身無相大身雖同而所顯各異故無著論云為入證道故經曰須菩提譬如有人妙身大身如是等顯示入證道時得智慧故離慢論言云何得智有二種智謂攝種性智及平等智若得智已得生如來家得決定紹佛種此為攝種性智此智已能得妙身論云平等智復有五種平等因緣謂粗惡平等法無我平等斷相應平等無希望心相應平等一切菩薩證道平等得此等故得為大身攝一切眾生大身故世親論云依彼法身佛故說大身喻故論釋大有二義一者遍一切處故名大此約法身二者功德大故名大此約應身遍故名大明真如為一切法通體功德大明報身出遇世間出世間法身稱妙出二障之外報身名妙契二空之理與無著釋殊彼得攝種姓智故妙得平等智故大今言妙者屬報身大者約法身亦不乖前旨經曰須菩提言至說名大身者此答釋也說人身妙大者引佛所即說法身為人身也則非大身者非是相報身世親論云無有諸相故是名非身大者有真如體如是即名妙大身說名大身者即是法身法也此名法身為所依報身為能依身者依止義法身依自性身報身依法身化身如攝論說上來第一約得記斷疑經曰佛言至非菩薩者次第二約化生斷疑無著論名離慢經曰證菩提者是自行度眾生者是化他昔無菩提則無自行今無菩薩誰化眾生耶兩重一標疑起問二答釋正斷初中復兩一就教無總標二約理無正問前則無邊慈後則如實智此總標也菩薩亦如是者上來就佛明法身菩提對彼情執彰有虛實自下還明菩薩行相有是有非與上法身無異故云亦如是我當滅度眾生此是慢者非實菩薩無著論云若菩薩有眾生念則不得妙身大身故經曰佛言至名為菩薩不者此約理無也於五陰中頗有實我為菩薩不經曰須菩提言至名為菩薩者此答釋正斷也兩意一依理答無二引說正斷此答無也明陰界入中本來空寂無有一法豈得有我名為菩薩經曰是故至無壽者者此引說也眾生無故無所度主宰無故無能度壽者無故無恆度此三若寂即是人空人既是空何有菩薩而度眾生經曰須菩提至是不名菩薩者次第三約嚴土斷疑疑曰若無菩薩者誰起心修行清淨佛土自他兩利耶為斷此疑三重一標疑二正斷三示真此標疑也經曰何以故至是名莊嚴佛國土者此正斷也上言莊嚴顯所嚴之土不可取今說莊嚴明能嚴之人不可得所嚴不可取即顯法空能嚴不可得即顯人空人法既空何有菩薩能嚴佛土乎故世親論曰不達真法界起度眾生意及清淨國土生心即是倒所以是倒由不達真法界故若起此心即是顛倒非菩薩者起何等心名為菩薩經曰須菩提至真是菩薩菩薩者此示真也二空名真菩薩成生自熟嚴淨佛土也初無我者即人空無我法者即法空菩薩菩薩者顯有二智一知世間智知凡夫二知出世間智知聖人以慈悲故不捨世間以智慧故不取流盡如是二處不著故重菩薩菩薩亦凡夫聖人二菩薩凡即三賢聖即十聖故無著論云為於彼二種無我中二種正覺故世親論曰此言攝世諦菩薩是故重說菩薩菩薩上來約菩薩斷疑竟經曰須菩提至有佛眼者此第二約如來斷疑世親論曰復有疑前說菩薩不見彼是眾生不見我為菩薩不見清淨佛國土何以故以不見諸法名為佛故若如是或謂諸佛如來不見諸法為斷此疑故說五眼無著論曰為見智淨具足故經說肉眼等又上言不見者但人法體空無定性可見非謂佛不能見故世親論曰雖不見諸法非無了境眼諸佛五種實以見彼顛倒兩重一即果斷疑二可以三十二相下推因斷疑即果三重一約應身斷疑二約化身斷疑三約法身斷疑應身兩重一約智身二約福身智身三重一出體二顯用三判境此初出體也無著論曰為見智淨具足故經言如來有肉眼不如是等肉眼以人中淨眼為體緣障肉色為境天眼以天中淨眼為體緣障外色為境無著論曰色攝慧眼以如理智為體緣真諦為境無著論云第一義諦攝法眼以如量智為體緣俗諦為境無著論云世諦攝佛眼以無功用智為體緣一切法為境無著論云一切種一切應知攝佛在人中生故有肉眼常在三昧故有天眼得不思議空智故有慧眼隨機說法故有法眼以一念相應慧知一切法故有佛眼通局云何肉天二眼凡聖通有後之三眼唯聖非凡大小者前三通大小乘後二大非小若爾小乘人得法眼淨此云何通解云此乃見法生滅遠離我相名淨非謂五眼中善知根欲性名為法眼也因果者前四通因果後一唯果對治者肉天二眼對治皮惑慧眼破肉惑法眼亦伏亦斷心惑如斷初地伏二地佛眼清淨斷三惑盡修報者肉眼唯報得無著論云法果天眼亦報亦修無著論同得餘三修得五眼中各二一問二答可知經曰佛言至如來悉知者此第二顯用也展轉三意初問答沙次問答界後正顯用前二可知顯用中無著論云為教彼眾生寂靜心故安立智若干種心者出所知也謂攝心亂心垢心淨心三毒四倒等條緒繁廣故以若干總之廣如大品經佛母品說無著論云若干種者謂染淨也如來悉知者正顯智用如來智淨所以悉知但心細難知尚能盡知況復粗色也經曰何以故至是名為心住者此第三判境也兩重一就境顯倒二即性名虛此就境顯也何以故者眾生心性各各不同何故如來以一心知故如來說諸心住者明住六塵皆為非心住者遠離四念處故非住是名心住者明住六塵者是顛倒心故又真諦解說諸心住者是三相心住皆非心住者有為諸法不停故非心住是名為心住者即是法性真實心住即問云何知法性心是真實心住耶解云餘心有為虛妄三相遷移不得名住法性不動不變故名心住也經曰何以故至未來心不可得者此即性相空也何以故者何以得知諸心有住皆非住故即答云過去心已滅空故不可得未來心未有空故不可得現在心虛妄分別念念不住即體是空故不可得無得以為得此為虛妄然諸心雖妄唯佛體妄故能知之心非倒也上來約智身斷疑竟經曰須菩提至得福多不者次約福身斷疑故無著論說福自在具足故三重一問二答三述此問也疑云若前心是倒此心修福為倒非倒如真是倒不應名善如真非倒何以依倒而生為斷斯疑示現心住雖倒福德非倒偈言佛智慧根本故無相之禮能生佛智故非倒也又復此禮依智而起故不倒也經曰須菩提至甚多者此答也若為報行施則心福俱倒以不求思報二俱非倒故云以是因緣得福多經曰佛言至福德聚福德聚者此是如是者述也若福德有實下釋時眾復疑聞向福德非倒便謂前三千恆沙亦應非倒為是故佛即告善吉若福德有實如來則不說福德聚福德聚此明若前福德即實我上亦不應說二種福德不可聞此福與佛智為本便謂前福亦實若福德有實者即有相若五度為般若所持而有相者佛即不說為福德聚以是無相故說為福德聚初福德聚是有相重福德聚是無相也經曰須菩提至見不者第二次約化身斷疑兩重一約化體二約化用此化體也兩重一約八十種好二約三十二相兩章各三一問二答三釋尋文可知此問好也世親論曰復有疑若諸佛以無為法得名云何諸佛成就八十種好三十二相而名為佛也案此若佛是色不應以真如為名若佛非色不應身有相好為斷此疑故發斯問也法身如來可以色身見不無著論云為好具足故經曰須善提言至色身見者此悟化真之不一故答以不應也此假異破一經曰何以故至具足色身者此釋何以故者明不應意真身是體化身是用色身即非色身以化入真也說名色身不離法身而有色身從真起化也此乃體用相依未曾相離也不得見化謗真聞真疑化也經曰佛言至說名諸相具足者此約三十二相斷疑唯前三重可解也無著論云為相身具足故經曰佛言至有所說法耶者此約化用斷疑疑曰若如來具足色身成就相好不可得見云何言如來說法為斷此疑兩重一斷疑二生信斷疑三重一出疑二遮疑三釋疑此出疑汝謂如來作是念我當即理離理有名教可說耶經曰須菩提莫作是念者此遮疑也汝勿謂如來即理離理有言說也經曰何以故至不能解我所說故者此釋疑何故遮汝莫作是念故故言何以故理外無說而謂有說此不解也依執口言則為謗也經曰何以故至是名說法者轉釋不解義何故不解即言說法說法者故初一說法即教彼一說法即義故世親論曰一者所說法二者所有義無法可說者推俗以入真於法界外無法為說所說即第一義空無自性可得故言無法可說是名說法者從體以起用謂從眾清淨法界流大悲從大悲流化身從化身流出經也經曰爾時至生信心不者此生信也前明有信信於因證果今明生信信於人法世親論曰復有疑若言諸佛說者是無所說法不離於法身亦是其無有何等人能信如是甚深法界為斷此疑善吉請問答意偈言所說說者深非無能信者此明有聖人能非凡夫也兩重一問二答此問也問中三意一人二時三於是法生信不所以有此問者前明法身是說者深次明言教所說復深既二重並深未來惡世眾生根鈍云何能信廣已如上約正教斷疑中具說經曰佛言至非不眾生者此答信也先答後釋非眾生者信此經者非凡夫眾生無著論云第一義故非不眾生者雖非虛妄凡夫眾生非不是因中聖人眾生也無著論曰世諦故經曰何以故至是名眾生者此釋也眾生者凡夫無信眾生又眾生者聖人有信眾生如來說非眾生者說非凡夫眾生是名眾生者是能信聖人眾生也經曰佛言至三菩提耶者此第三約法身斷疑疑曰證果下者有上證果上者無上前說實無有法得菩提無上之名因何而立為斷此疑故為斯問答意明菩薩有二種一者法身體非作法二者報身修善方有不可聞法身非修便謂不須修道道亦不可修得於中三重一約法身果斷疑二約法身因斷疑三約法身業斷疑出離真如為果一切善法為因解脫眾生為業約果四重一問二答三述四釋此問也汝等意謂如來法身要修道方得耶彰體滿也經曰須菩提言至三菩提者此答也法身本寂何有可證能證也無著論云此顯示菩提自相故菩提解脫相故彼中無微塵許法有體是故亦無可得亦無所有應知經曰佛言至三菩提者述也諸法本寂煩惱性空煩惱既空有何可斷空即是滅何須別證此滅即無上菩提也經曰復次至三菩提者此釋也三重一體無等二淨無等三道無等此體無等也體即法界也在聖不高居凡不下眾生成佛亦不增不減佛亦不滅故云平等無有高下釋平等也既云平等故無上也此約性淨不增不減無著論云無高下者顯示一切諸佛第一義中壽命等無高下故經曰以無眾生至三菩提者此淨無等也以無眾生等故因時自性清淨果時無垢清淨淨既無等即無上也此明二空無著論云顯示菩提於生死法平等相故前未約性淨釋無上也經曰一切善法至菩提者此道無等即方便淨兩意一攝體二顯用此攝體也世親論云又彼法有無上方便以一切善根滿足故說阿耨菩提無上方便即福智圓滿故云無上無著論云顯示菩提道故以因無上故得菩提然菩提有四一信樂出世即伏心菩提二者見位雖見如如是出世初無分別智三者十地受菩薩灌頂位猶有餘後無分別智此三種菩提猶有上下不名無上唯佛菩提是出世後無分別智乃名無上經曰須菩提至是名善法者此顯用也善法者是出世善法世親論曰以無有漏法故是故名為善法說非善法者非世間善法世親論云彼法無有漏法故名非善無著論云此安立第一義相故是名善法者結是出世善法也世親論曰以決定無漏善法故此因既無等故果無上也經曰須菩提至所不能及者次第二約法身因斷疑疑曰若一切善法滿足得菩提者則所說教法不能得大菩提何以故以所說法是無記法故云何以無記因得菩提果此是薩婆若多部所執彼宗以名味句為教法體名等性是無記故為此疑若大乘宗出教體者如佛地論說為斷此疑明汝法是無記而我法是記何者正記即是發起善本從真實生末還顯真實所以一切法寶勝無量珍寶也於內三重一舉施二持經三比勝歌羅分者此義翻為口勝如析一毛為百分一分為歌羅明持經功德有大勢力唯取一歌羅分亦勝施福優波尼沙陀者此義翻為因勝明持經功德成無漏因布施善根但成有漏因也中論以四義釋世親論曰云何為勝一者數勝如經百分不及一等故二者力勝如經不及一歌羅分故三者無似勝者此福德中數不相似此福不可數故如經所不能及故四者因勝因果可不相似此因果勝彼因果故如經乃至優波尼沙陀分不及一故經曰須菩提至度眾生耶者次第三約法身業斷疑世親論云復有疑若是法平等相無高下者云何如來名度眾生為斷此疑故五重一條疑二遮止三出過四顯德五釋成此初條疑莫謂我為能度他為所度無著論曰為安立第一義教授故經言如來頗作念等經曰須菩提至如來度者此遮止也佛及眾生俱不離法界故無能度所度又復己外無眾生故無所度眾生外無己故能度今言度者此乃依世俗故說非為勝義故世親論曰平等真法界佛不度眾生以名共彼陰不離於法界故此有二義一以平等法界離自他增減相故二以不出如來雖度假名眾生不將出法界之外故云實無有生如來度者花嚴經云不增眾生界不減眾生界此就法身真實無增減也大品小品中皆說一切眾生本來清淨假令諸佛於百千劫唱言眾生而無一實眾生可得以此驗之平等理中無眾生異佛而相度也故諸法無行經云佛不得佛道亦不度眾生凡夫強分別作佛度眾生是人於佛法則為甚大遠又若佛度眾生是則佛還度佛法界還度法界以此而推即法身上有此眾生名字非法界外有別可度故不增不減經云或覆法身名為眾生無著說亦同此說經曰佛言至壽者相此出過也若佛起心謂法界之有五陰所成虛假眾生而可度者是則如來猶有我執豈名為佛故諸法無行經云若人作是念我當度眾生即著眾生相是人無菩提亦無有佛法住於身見中案此即與凡同故云則有我相經曰須菩提至以為有我者此顯德也如來說我非我者顯佛說我隨俗故說而不取我故曰即非此乃聖與凡殊毛道凡夫生者以為有我者嬰愚凡夫說我取我隨言起著故云以為有我則凡與聖別也毛道凡夫者此依梵正言云婆羅必栗託仡魚乞反那婆羅此云愚必粟託此云異仡那此云生總言愚異生義譯名凡夫案梵毛言縛羅愚名婆羅此譯人之失言毛道取依能斷經云愚夫異生羅什譯經直云凡夫此乃不善梵音訛於清濁失在此耳經曰須菩提至是故言毛道凡夫生者此釋成也生者起也凡夫起我取生死法故曰生者不取隨順法界聖人法故說非生是故下結凡夫起我故曰凡生上來從五眼以來依果斷疑竟經曰須菩提至得見如來不者此第二推因斷疑展轉五重一斷執因比果疑二斷謗因無報疑三斷迷常謗果疑四斷化真一異疑五斷動靜相違疑此初疑也先長行後偈頌長行五重一問二答三述四難五成此問也疑曰前說如來不可以相知若可以相知應可以福感為斷此疑故問汝可以同凡之偽相觀異化之法身不經曰須菩提至得見如來者此答也法身非色比智理不能知不可以福能感相便謂以相比法此明相非真也經曰佛言至見如來者此述也善吉所談理當所以再言如是也經曰佛言至應是如來者此難也若以相觀法身則輪王應是佛若觀王不見佛則都相非法身故論曰非是色身相可比知如來諸佛唯法身轉輪王非佛經曰是故至得見如來者此結成相報非法身經曰爾時世尊至彼識不能知者此偈頌也此有四意一為攝持妄失前於長行散說已廣時眾或散亂遺妄不憶次第故以偈略說令得憶持二者前長行廣說為鈍根者令得解故此偈略說為利根者攝多義故三者為顯邪正方便若邪方便但約相觀無相若正方便約無相觀無相今令離邪修正故說此兩偈顯邪非正也四為時眾一聞之中有鈍根者未得解了如來慈悲不辭疲倦故重為說也此偈兩重初偈明邪境邪觀後偈顯正境正觀前中初半行顯邪境邪境者小乘明佛唯約二種一取色謂相好身二取聲類謂長時無間聞不重義所以小乘具足色聲為佛者色對眼聲對耳但受化之徒因見色聞聲次見聖道故一切小乘同執色聲以為真佛若但色相無說如輪王也若但有說無相如二乘弟子並是佛也今大乘中若以色聲求佛即成邪境良以法身絕眾相故是人行邪道者此句顯邪行是人即凡夫二乘人由約色聲起見聞等謂見如來故是邪行何以故法身如來是無分別智所證見故不能見如來者此句顯邪得若以見聞等行不得無德但得妄境不見法身故云不能見如來也彼如來妙體即法身諸佛者下一偈明正境正觀此二句明正境彼如來妙體即法身此明真身境諸佛者即應化二身此明智悲境法體不可見者此句明正觀法體非色故不可以眼見也又不與四人共見故不可見一凡夫如生盲故不見二二乘如始生嬰兒不見日輪三空散亂菩薩如翳眼人見色不明四深行菩薩如羅縠中視見不明了此四人既不見故即顯如來能見若爾何法能見應云無分別智稱境而見彼識不能知者謂虛妄顛倒六識不能知也此顯正得識既不知何法能知應答云三無性觀知故世親論曰唯見色聞聲是人不知佛以真如法身非是識境故此偈一句釋經兩句可知經曰須菩提至菩提者次第二斷謗因無報疑無著論曰若爾如來雖不應以相具足見應相具足為因得菩提世親論曰有人起如是心若不依福德得大菩提如是諸菩薩摩訶薩則失福德及失果報為斷此疑六重一遮果無二遮因滅三量遮力四出遮因五領遮理六答遮義此遮果無也先問次遮此問也可以修成相好成就得法身菩提也莫作是念者此遮也明法身菩提定不為福相成就故云莫作是念而法身不無此遮也經曰須菩提至斷滅相此第二遮因滅先牒次遮後釋此失因若言失因即說斷滅也此下一段經依無著般若論云於心具足中為不住生死涅槃故經言汝作念發行菩薩乘者如是等論云於法不說斷滅相者謂如所住法而通達不斷生死影像法於涅槃自在行利益眾生事案此由慈悲故不斷生死由智慧故不捨涅槃論云此中為遮一向寂靜故顯示不住涅槃案此異二乘論云若不住涅槃應受生死苦惱為離此著故乃至是故菩薩取福德等案此異凡夫莫作是念者此遮也若說斷滅則不成發心何以故至不說斷滅相者此釋也既發心故則不說斷滅也然斷不斷義凡有二種一事二理若就事者則有能斷智所除障智漸增惑轉減智增故二障除惑減故三德備若就理者菩薩畢竟不見生死涅槃二相可得若見生死可盡涅槃可得即斷常二見豈中道正解而對治中言斷生死得涅槃者此盡斷無所斷得無所得雖斷非斷故斷雖得非無得故得雖得非無得故得在於無得可無得以得之雖斷非無斷故斷在於無斷可無斷而斷之是故菩薩常知於二而無二也今以明菩薩得無生忍所修諸善與法性相應轉更精勝終成佛地畢竟常住不同小乘捨滅身智故云菩薩發心不說斷滅也經曰須菩提至所得福德者此第三量遮力也向雖云福不斷滅而未知何時不斷今明菩薩得無生時功德不斷轉更增廣無著論亦同此說故引此喻顯轉勝不斷也知一切法者有為無有流無流三性等法無我者約分別性得無生者約依他性又復無我有二謂無人我及無法我約無識者說人無我何以故於外道所執二十種身見中無有識者可得也約三無性說法無我何以故三無性中平等一味無有一法可為我也無著論云如來於有為法得自在故無彼生死法我故名無我者無生者約因果及自他皆不成故說無生無著論曰非業煩惱力生故無生法忍者無生法謂無生無滅不斷不常之法是所修真如境也忍者是能觀之相名或是般若當體立名也若小乘說但有法無人唯忍於法故名法忍若大乘說但以真如為法謂三無性本來不生是般若所緣故名無生法忍忍者即是忍受堅固不可破壞又忍有二一為無間道故說忍何以故智未起時一切煩惱熏習於心至智起時能解煩惱至得所對之惑不能間礙般若所經煩惱雖復正對亦不能間故名般若為無間道二為無礙道以其堅固惑不能壞也經曰須菩提以諸菩薩不取福德故者此第四出遮因前約不滅以明得今約不取以明捨以不取相故不感有為果報所以勝前福也無著論云顯示不住生死若住生死即受福聚經曰須菩提至不取福德者此第五領遮理也別本中善吉問不受理但領前也問亦不妨由菩薩不取相故則知不感有漏之果故云不取也無著論曰此有何義以世尊於餘處說應受福聚故經曰佛言至取福德者此第六釋遮義受不取者菩薩知有二種無我名之為受而不著相故言不取偈言是福德無報如是受不取故是福諸即無漏之福若菩薩依菩提心修福慧二行及真如觀內外貪愛即便除滅是故菩薩所修福德無有執取此無漏業不招報故故言不取世親論曰無彼有漏報是故此福受而不取取者有三一謂離菩提心起諸善業二但修福德不修智慧三但修俗觀不修真觀由此三義故名為取論云取者彼福德得有漏果報故彼福德可呵名之為取是故菩薩取福德者結上受無漏果報福也無著論云以方便應受而不應取經曰須菩提至不解我所說義者此第三斷迷常謗果疑一遮二釋遮疑曰若菩薩福德之因不受世間報者云何如來有去來坐臥同世威儀為眾生受用既四義三相遞易更遷此若名常誰其無常為斷此疑若有人者即凡小人也約彼化身而執法身有來去等而非常者此不解我所說也此明法身於三位不動一道前二道中三道後今言去來者即化身佛故世親論曰去來化身佛如來常不動於是法界處非一亦非異案常不動者即法身也無著論說行者謂去來住者餘威儀不解我說者此有四種一依不了義經二依言不依義三以文字為勝不以義四但得聞慧未得修慧由此義故不解所說經曰何以故至名如來者此釋意也更曉不解之意故云何以故如來者即法身也體是常住無生無滅非三世攝約現在望過去不滅故無所至去也約現在望未來世不生故無所從來也有無損減故無所至去無增益故無所從來也以如是法如是智故名如來也約此法說如約此智名來即境智無著別變異故名如來經曰須菩提至寧為多不者此第四斷化真一異疑疑曰若應佛有去來真佛不去來者未知二佛為一為異若一不應有去來等異若異未知供養應佛為得福不為斷此疑故前論云於是法界處非一亦非異此明如來三界受生或時一異今既惑盡住佛界中法界平等無有二相故能證之人亦無一異其猶微塵未碎則有彼此既碎為末則無方所以況諸佛煩惱盡時無有一異以無異故供養應佛其福無量世親論曰世界作微塵此喻示彼義微塵碎為末示現煩惱盡於中三重一破粗為細二推有入無三障盡說益前中復二初問次答此問也世界作塵是塵從界出譬法身垂迹則化從法生此為多不經曰須菩提至甚多世尊者此答也塵多遍空化周法界故云甚多經曰何以故至是故佛說微塵眾者此第二推有入無兩重一破相結二破粗重結相結謂塵界粗重謂二見相結兩重先破微塵後破世界微塵四重一徵二釋三證四結何以故者此徵也若微塵碎末無有體者何故答云甚多故若是微塵眾實有等者釋也若實有別物是塵眾者佛應依其自體立具自名不應依他微塵而立眾名由眾無異體不可自立故約微塵而假立名故言若復微塵眾實有者佛則不說也何以故等者此證也何以故者何以得知微塵假說無自體故此有三義一若離微塵無有別聚不成二由鄰虛不成就聚亦不成鄰虛不成就者若一分為聚則無實鄰虛何以故鄰虛復由多物成故三若具分聚集成鄰虛者既無大物一切諸物但唯守本如鄰虛大無增長義以此義故無有聚無有聚故亦無大千世界也鞞世師說鄰虛是實是常無有方分此雖常無異而為失不殊何者如一時七塵共聚如具是實一分觸耶具分觸耶若一分觸中間一塵向外有六萬之分則如一分若具分塵觸則外邊六塵向內同為一體有方之一分則是假而如實同為一體復不可積小以成其高用此而推則鄰虛是假故曰塵眾則如塵眾非實也是名者結但假施設也經曰世尊至是故佛說三千大千世界者次破世界五重一立虛二破實三轉假四入真五推妄此立虛也若離能成之塵所成之界微塵決非是實故世界亦假同前可知經曰何以故至是一合相者此破實也若塵界並空云何兩說故小乘執聚分是實聚是假名譬如己指是實權是假名若今執界為有物即界如微名即與界分之執同故言是則一合相若作此執即同外道為有分執亦名具分執若界分不合則是非實經曰如來說至佛說一合相者此轉假也合是觸義若合是具分觸則世界量等鄰虛若合是一分觸則世界終無別體故一合亦非一合也而名一合者但假施設也又非一合相者有三義一所執之聚無所有能執亦不得成二無物中強生分別執以為有執不當類是故非執三是非理惡執此三並是非執故言非一合也是名一合相者此為顯真依正智依正智者分是實有聚是假名有故說一合相也真正智者名聚物三種平等實無所有此一合相執與一合相同無所有故說一合相也無著論曰此須菩提安立第一義諦故經曰佛言至則是不可說者此入真也此明塵雖空而不壞假名說諸法相法界平等非一非異非有非無此乃證智所知非言能述故無著論曰世言說故有彼搏取第一義故彼法不可說也經曰但凡夫之人貪著其事者此推妄也言說者凡情之妄取依名起執不依於義故無著論彼小兒凡夫如言說取非第一義也經曰何以故至為正語不者次破粗重結先舉次釋何以故者舉也凡夫有著可取塵界如來無取何故亦說界及塵故下釋先破人見後破法見人見三重一問二答三釋此問也人法是境見則是心境則遍計所執見則依他起性遍計所執是無依他起性是虛無則不可斷滅虛則不可滅無顯可滅義故為此問有人謂佛先說有我後得無我為正語不正語有三一依了教語二順道理語三不生謗心語若依此三名為正語經曰須菩提言不也世尊者此答也若謂如來約有約無說我見等翻前三正並非正語故云不也經曰何以故至壽者見者釋也先釋後結此釋也若外道約有起此四見若二乘約無起此四見於二乘為障無見於菩薩為障今明我法本空二見寂滅無斷無證實無所有所見有無既不成就能見之心亦不得有不同愚小故曰即非故無著論云此等顯示如所不分別外道說我如來說為我見故安置人無我此釋即非我見是名我見等者結不同愚小也明此四見以有為性亦無以無為性亦無雖有無不同並皆非見但隨虛妄而說見也世親論曰見我即非見無實虛妄見故經曰須菩提至不住法相者此破法我見非見故無著論云又為說有此我見故置法無我先舉能對法後明所破障此舉法也於一切法者總舉無著論云顯示於何法不分別如是知者無著論云此顯示增上心故如是見者增上智故是信解者於無分別中知見勝解也論又解云若智依止奢摩他故知依止毗鉢捨那故見此二依止三摩提故勝解以三摩提自在故解內攀緣影像故名勝解又釋如是知者謂世俗智如是見者謂出世智如是信者謂約前二智出生世出世定俗智者即學真如方便得聞惠故真智者即契真如無分別修惠智也世定即小乘九次第定出世定即三空門也又如是知者知境界得法無我爾炎地故如是見者通達人無我故如是信者隨順法界故如是不住法相者無著論云此正顯示無分別故案不著前三能對法亦不取三相也又不住法相者於人法二處無適住著故故世親論曰此是微細障見真如遠離也經曰何以故至是名法相者此破障也何以故者何故如是不住法相故又何以法相不得生起故法相法相者謂真相俗相也又地前地中所破相如是等如來說即非法相者即世出世法相能取所取實無所有不可言說故非法相也又世俗法非出世法相出世法非世法相餘如上說經曰須菩提至無量阿僧祇者此第三明障盡說益四重一量說力二問說相三答不取四證不取此量說力也謂明如來由化身顯說功德無窮故說譬格量於中有兩一明上人下功德謂財施二下人行上功德謂持說此之二福由法故有勝劣不由人也此是初門或約福慧二行故言菩薩摩訶薩或約二利或約悲智名摩訶薩前來明施並有限量今明無量故顯福勝也勝有二義一財多二人勝此明上人行七寶施故是下品功德善男女等者此是第二下人於此般若經持說一偈者此上品功德勝彼無量等者正格量也此明下人行法猶勝上人行於餘行何況上人行此上法所得功德故不可量也此由法施無量無盡無漏故勝如上具釋經曰云何為人演說者此問說相也未知化佛說法之時為自顯化身而說為不顯化身而說此云何若顯我是化身則受化眾生於佛及所說法即不生尊重心謂是幻化故由不尊人故不受正法不受則有大損也經曰須菩提而不名說者此答不說也而不名我是化身為人說法也由不顯自身是化故令眾生於佛起尊重心受所說法由尊人重法故生無量功德也論偈曰諸佛說法時不言是化身經曰是名為說者此證不說而不名說也別本云如如不動又由智故說此經由悲故不言化此說及不顯說即是正說故云是名為說又起眾生尊重恭敬心由此二義令眾生得正行及恭敬行故言是名為說也此乃益常故名為不動論偈曰以不如是說是故彼說正也經曰爾時世尊而說偈言者此下第五斷動靜相違疑先控引後偈頌此控引也經曰一切有為法應作如是觀者此偈頌也世親論曰復有疑若諸佛如來常為眾生說法云何言如來入涅槃案此則乖前說何者若入涅槃則不說法若恆說法則不入涅槃為斷此疑故說此偈論偈曰非有為非離諸如來涅槃九種有為法妙智正觀故此明諸佛涅槃不在有為不離有為以智故不住有為以悲故不離有為世親論云何故諸佛示現世間行而不住有為法中耶案有為法中有九種無常相即是顛倒是故不住雖復在中不為所染論云九種有為法妙智正觀故一切有為法者此一句統舉諸法有三相遷者皆名有為則一切有為不出九種如星等者正出喻體有為雖眾九種統之何等為九即譬九法九喻者一星二翳三燈四幻五露六泡七夢八電九雲如經所列九種法者一見二相三識四器五身六受七過去法八現在法九未來法故世親論曰見相及於識器身受用事過去現在法亦觀未來世即以九喻對於九法如其次第可知依無著論束此九法以為四種有為相所謂自性相著所住味相隨順過失相隨順出離相前之三喻各譬一法是自性相謂相塵識各有自體故次一約喻顯著所住味相謂器世間識所變作無體實故次露泡二喻顯隨順過失相謂無常苦恆逐故後之三喻顯隨順出離相謂二空無分別智離妄攀緣得出離故故無著論云如是知三世行轉生已則通達無我故如星者此喻諸見亦六內入世親論曰譬如如星宿為日所映有而不現能見心淨亦爾案能見則諸見無著論云共相見識也法性常有為見所覆有而不現如星夜燭日出便隱諸見亦爾雖覆法性智即生滅故如星也翳者世親論曰如目有翳則見毛輪等色非有此喻能遍計心實無人法妄計人法無著論云人法我見如翳應如是見何以故以取無我義故猶塵也世親論喻相即所見外入但識變作似而非實妄說為有故如翳見此喻所遍計燈者喻六識我愛為體世親論云依貪愛法住故無著論說渴愛潤取緣故熾然光依油炷新滅識亦如是依愛而住念念無常幻者喻器即器世間無實為性盛貯為用世親論云器世間種種差別無一體實故案此由眾生業幻故見種種世界差別隨眾生受用妄盡即無著論云味著顛倒境界故彼如幻應如是見何以故以顛倒見故露者喻身以根塵為體世親論說以少時住故無著論云彼露譬喻者顯示相體無有以隨順無常故露但夜陰見日便晞身雖暫停逢死必壞泡者喻所受用事世親論云以受相因三法不定故案因即是行無著論云泡譬喻者顯示隨順苦體以受如泡故若有受皆是苦生故是苦苦破滅故是壞苦不相離故是行苦夢者世親論云又如夢過去法亦如是以唯念故謂諸法已滅非證智境但為憶持所緣故應觀如夢夢中無有五識證知若已覺時意識復滅但憶念攝持體無所有以非有法故譬之如夢電者喻現在法論曰又如電現在法亦如是剎那不住故譬如電光緣聚所作不由功用念念自滅現法亦爾雖是有法由功用起不由功用自然消滅以無恆隨非安心處故喻之如電雲者喻未來法世親論曰又如雲未來法亦如是以於子時阿賴耶識與一切法為種子根本故此明無始時也故攝論曰此界無始時一切法依止等故謂未來果報從種子生阿賴耶識生故未來果時但名種子遍滿本識應觀如雲在空滿空而未有雨已竟雲即散滅若果報起種子便謝故未來法約果未有故無所有如雲時未雨也故以譬雲上來偈竟世親論曰觀此九種得何功德成就何智論偈云觀相及受用觀於三世事於有為法中得無垢自在論釋有三一觀有為法以觀見相識即前三法見謂清淨識相是色陰識是識陰此三是因見者依識緣相故起生死所以此三是因也二者觀受用即是果果是生死生死有三一受用處謂器世界二能受用即是身三所受用即苦樂捨此三是果即中間三法三者觀有為行以何等法三世轉差別故即前因果不離三世謂由過去無明行二因感現在五果復由現在三因感未來生老死二果此即十二因緣如別具述觀此因果等三即是三解脫門觀若見此九種無人無法即空解脫門觀此九種皆空離於十相即無相解脫門若見此空及無相由此九法成故即知此九法不可願求即無願解脫門觀前二是真觀觀無願是俗觀約空無相二觀故起般若約無願觀起大悲若但起般若不起大悲即同二乘若但起大悲不起般若即同凡夫若依般若約俗行者此行不起菩薩垢由了別有為過失故謂忘三事而行俗行故若約俗行真行者亦不生菩薩垢由不怖畏涅槃故何以故能了別涅槃功德故若並行真俗二行菩薩於生死涅槃得無礙自在謂無住處涅槃此並行異前依真行俗依俗行真者謂並行自利利他即八地方成初地菩薩猶未能恆爾也如來得此九觀所以不動上來廣明經體彰即坐之益竟經曰佛說至信受奉行者此下大文第三流通也列眾多少已如上釋不復重論兩聖對揚四部蒙益是故心喜而身躍信受以流通也若向前述者信則序分依稟聖言故受則正宗奉持所說故奉行則流通津遐代故錄文完
