front:
  text: 金剛般若經疏整理者華方田題解金剛般若經疏又名金剛經疏金剛般若波羅蜜經疏佛教經典注疏作者不詳二卷或三卷本文獻由五號組成一斯號首尾皆殘存行二斯號首尾皆殘存行三北京圖書館藏北始號首尾皆殘存行四北京圖書館藏北閏號首殘尾全存行有尾題曰金剛般若疏卷下此號實由兩段拼接而成前段行整理本稱之為北閏號上後段行整理本稱之為北閏號下五北閏號首尾皆殘存行本文獻所疏釋的是元魏菩提流支譯金剛經此五號體例相同字體相同內容前後相屬原本當屬同一文獻從內容上看本文獻可能為兩卷前兩號應屬上卷後三號當屬下卷但因後人誤將原本互不連接的兩段綴成北閏號所以産生了次序上的混亂正確的次序應為斯號所疏相當於羅什譯本第一分至第六分斯號所疏相當於羅什譯本第十一分至第十三分北京圖書館藏北始號所疏相當於羅什譯本第十四分至第十五分末北京圖書館藏北閏號上所疏相當於羅什譯本第十六分至第十七分初北閏號所疏相當於羅什譯本第十七分至第十九分北閏號下所疏相當於羅什譯本第二十分至第三十二分現存金剛經疏大多疏釋羅什本此文疏釋菩提流支本較為罕見文中大量引用無著的金剛般若論世親的金剛般若波羅蜜經十地論佛地論大智度論俱舍論大品般若經大集月藏經文殊師利所説般若波羅蜜經涅槃經法顯傳等經論有很高的研究價值本文獻層次清楚邏輯嚴緊資料豐富立義精當對金剛經這一著名佛典提出了許多很有意義的獨特的闡釋為金剛經研究提供了寶貴的資料整理本的底校本情況如下底本斯號斯號北始號北閏號上北閏號北閏號下無校本録文
